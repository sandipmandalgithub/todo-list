<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo List</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header class="header">
            <h1>Todo List</h1>
            <p>Manage your daily tasks easily</p>
        </header>

        <!-- Counter -->
        <section class="counter-section">

            <div class="counter-card">
                <h2 id="totalCount">0</h2>
                <p>Total</p>
            </div>

            <div class="counter-card">
                <h2 id="completedCount">0</h2>
                <p>Completed</p>
            </div>

            <div class="counter-card">
                <h2 id="pendingCount">0</h2>
                <p>Pending</p>
            </div>

        </section>

        <!-- Add Todo Form -->
        <section class="add-todo-section">

            <h2>Add New Todo</h2>

            <form id="todoForm">

                <div class="form-group">
                    <label for="title">Title</label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter todo title"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">Description</label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Enter todo description"
                        rows="4"
                    ></textarea>
                </div>

                <button type="submit" id="addTodoButton">
                    Add Todo
                </button>

            </form>

        </section>

        <!-- Loading -->
        <div id="loadingMessage" class="message loading-message">
            Loading todos...
        </div>

        <!-- Error -->
        <div id="errorMessage" class="message error-message">
            Failed to load todos.
        </div>

        <!-- Success -->
        <div id="successMessage" class="message success-message">
        </div>

        <!-- Todo List -->
        <section class="todo-section">

            <h2>My Todos</h2>

            <div id="todoList" class="todo-list">
                <!-- Todos will be added here -->
            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
