<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo List</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header class="header">
            <h1>Todo List</h1>
            <p>Manage your daily tasks easily</p>
        </header>

        <!-- Todo Counter -->
        <section class="counter-section">

            <div class="counter-card">
                <h2 id="totalCount">0</h2>
                <p>Total</p>
            </div>

            <div class="counter-card">
                <h2 id="completedCount">0</h2>
                <p>Completed</p>
            </div>

            <div class="counter-card">
                <h2 id="pendingCount">0</h2>
                <p>Pending</p>
            </div>

        </section>

        <!-- Loading Message -->
        <div id="loadingMessage" class="message loading-message">
            Loading todos...
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="message error-message">
            Failed to load todos.
        </div>

        <!-- Todo List -->
        <section class="todo-section">

            <h2>My Todos</h2>

            <div id="todoList" class="todo-list">
                <!-- Todos will be added here using JavaScript -->
            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
